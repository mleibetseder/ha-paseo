name: Release

"on":
  push:
    tags: ["v*"]

# Only GITHUB_TOKEN is used. Contents write is needed to create the release.
permissions:
  contents: write

jobs:
  release:
    name: Release (tag must equal the manifest version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Tag equals manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          manifest=$(jq -r .version custom_components/paseo/manifest.json)
          echo "tag=$version manifest=$manifest"
          if [ "$version" != "$manifest" ]; then
            echo "::error::tag $TAG does not match manifest version $manifest"
            exit 1
          fi

      - name: Zip the integration for HACS
        run: |
          set -euo pipefail
          cd custom_components/paseo
          zip -r -X "$GITHUB_WORKSPACE/paseo.zip" . -x '__pycache__/*' '*/__pycache__/*' '*.pyc'

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" paseo.zip --verify-tag --title "$TAG" --generate-notes
